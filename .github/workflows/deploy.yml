name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 提交记录由 ranking.yml 重新生成 dist/ 后自行部署；若这里也被提交推送触发，
    # 它会用尚未更新的 dist/ 部署一次，可能覆盖掉 ranking.yml 的新部署。
    paths-ignore:
      - 'submissions/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
